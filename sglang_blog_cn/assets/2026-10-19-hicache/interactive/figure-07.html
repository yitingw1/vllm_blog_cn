<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交互图 7</title><style>body{margin:0;padding:18px;background:#f7f8fa;color:#172033;font-family:system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1200px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}button{border:1px solid #ccd5e1;background:#fff;color:#172033;border-radius:8px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#1769c2;color:white;border-color:#1769c2}img{display:block;max-width:100%;height:auto;border:1px solid #dce2ea;border-radius:12px;background:white}p{color:#637083;font-size:14px}</style></head><body><div class="wrap"><div class="toolbar"><button data-src="../figure-07.png" aria-pressed="true">默认视图</button><button data-src="../figure-07-state-1.png" aria-pressed="false">滑块1：中间</button><button data-src="../figure-07-state-2.png" aria-pressed="false">滑块1：末端</button></div><img id="view" src="../figure-07.png" alt="交互图 7"><p>选择上方状态查看原交互图的不同呈现。</p></div><script>const v=document.getElementById('view');document.querySelectorAll('button').forEach(b=>b.onclick=()=>{v.src=b.dataset.src;document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))})</script></body></html>
