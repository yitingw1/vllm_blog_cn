<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGLang 原文图表本地浏览器</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fa;--card:#fff;--text:#172033;--muted:#64748b;--line:#dce2ea;--accent:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#151b23;--text:#e7edf5;--muted:#9aa8ba;--line:#303a48;--accent:#75b7ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif}
main{max-width:980px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
img{display:block;max-width:100%;max-height:620px;margin:auto;border:1px solid var(--line);border-radius:10px}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0;flex-wrap:wrap}
button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}#label{color:var(--muted);line-height:1.5;text-align:center}#count{font-variant-numeric:tabular-nums;color:var(--muted)}
</style></head><body><main><section class="card"><img id="figure" alt=""><div class="controls"><button id="prev" type="button">上一张</button><span id="count"></span><button id="next" type="button">下一张</button></div><p id="label"></p></section></main>
<script>
const figures=[{"src": "../figure-01.png", "label": "Batch-1 decode speed on Kimi K3: 44.3 tok/s at baseline, 112.5 tok/s after the 15-step kernel ladder, ~423 tok/s with DSpark speculative decoding, 9.5× overall on 8×GB300 TP8"}, {"src": "../figure-02.png", "label": "交互图 2"}, {"src": "../figure-03.png", "label": "交互图 3"}, {"src": "../figure-04.png", "label": "交互图 4"}, {"src": "../figure-05.png", "label": "交互图 5"}, {"src": "../figure-06.png", "label": "交互图 6"}, {"src": "../figure-07.png", "label": "交互图 7"}, {"src": "../figure-08.png", "label": "交互图 8"}, {"src": "../figure-09.png", "label": "交互图 9"}, {"src": "../figure-10.png", "label": "交互图 10"}, {"src": "../figure-11.png", "label": "交互图 11"}, {"src": "../figure-12.png", "label": "交互图 12"}, {"src": "../figure-13.png", "label": "交互图 13"}, {"src": "../figure-14.png", "label": "交互图 14"}, {"src": "../figure-15.png", "label": "交互图 15"}, {"src": "../figure-16.png", "label": "交互图 16"}, {"src": "../figure-17.png", "label": "交互图 17"}];let index=0;
function render(){const f=figures[index];const img=document.getElementById('figure');img.src=f.src;img.alt=f.label;document.getElementById('label').textContent=f.label;document.getElementById('count').textContent=(index+1)+' / '+figures.length;}
document.getElementById('prev').addEventListener('click',()=>{index=(index-1+figures.length)%figures.length;render();});
document.getElementById('next').addEventListener('click',()=>{index=(index+1)%figures.length;render();});
render();
</script></body></html>
